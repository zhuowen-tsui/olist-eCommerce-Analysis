<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Olist Brazilian E-Commerce Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1050px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h1 {
            color: #333;
        }
        .dashboard-item {
            margin-bottom: 50px;
            border: 1px solid #ddd;
            padding: 10px;
        }
        h2 {
            color: #444;
        }
        .viz-container {
            width:100%;
            height:950px;
        }
    </style>
    <!-- Tableau Embedding SDK -->
    <script type="module">
        import { TableauViz } from 'https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js';
        window.TableauViz = TableauViz;
    </script>
</head>
<body>
    <h1>Olist Brazilian E-Commerce Visualization Dashboards</h1>
    <p>Interactive Tableau dashboards for Olist e-commerce data analysis.</p>

    <!-- Dashboard 1 -->
    <div class="dashboard-item">
        <h2>Dashboard 1: User</h2>
        <tableau-viz 
            id="viz1"
            class="viz-container"
            src="https://public.tableau.com/views/olist_Ecommerce_user/user"
            hide-tabs
            toolbar="bottom">
        </tableau-viz>
    </div>

    <!-- Dashboard 2 -->
    <div class="dashboard-item">
        <h2>Dashboard 2: Goods</h2>
        <tableau-viz 
            id="viz2"
            class="viz-container"
            src="https://public.tableau.com/views/olist_Ecommerce_goods/goods"
            hide-tabs
            toolbar="bottom">
        </tableau-viz>
    </div>

    <!-- Dashboard3 你自行替换src链接 -->
    <div class="dashboard-item">
        <h2>Dashboard 3: Order & Logistics</h2>
        <tableau-viz 
            id="viz3"
            class="viz-container"
            src="PASTE_YOUR_LOGISTICS_DASHBOARD_LINK_HERE"
            hide-tabs
            toolbar="bottom">
        </tableau-viz>
    </div>

    <!-- Dashboard4 -->
    <div class="dashboard-item">
        <h2>Dashboard 4: Review & Satisfaction</h2>
        <tableau-viz 
            id="viz4"
            class="viz-container"
            src="PASTE_YOUR_REVIEW_DASHBOARD_LINK_HERE"
            hide-tabs
            toolbar="bottom">
        </tableau-viz>
    </div>
</body>
</html>
